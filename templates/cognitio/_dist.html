{% comment %}Barra de distribuição de estados. Recebe ``dist`` [(rótulo, classe, n, %, x)].{% endcomment %}<div class="stack-bar" role="img" aria-label="{% for label, css, n, pct, x in dist %}{{ label }}: {{ pct }}%{% if not forloop.last %}; {% endif %}{% endfor %}"><svg width="100%" height="14" viewBox="0 0 100 14" preserveAspectRatio="none" aria-hidden="true">{% for label, css, n, pct, x in dist %}<rect class="bar {{ css }}" x="{{ x }}" y="0" height="14" width="{{ pct }}"></rect>{% endfor %}</svg></div>
