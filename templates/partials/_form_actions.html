{% comment %}Barra de ações fixa do formulário: hint (opcional), Cancelar e o botão principal.{% endcomment %}
<div class="form-actions">
  {% if hint %}<span class="hint">{{ hint }}</span>{% endif %}
  {% if cancel_url %}<a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancelar</a>{% endif %}
  <button type="submit" class="btn btn-primary"{% if disabled %} disabled{% endif %}>{{ submit_label|default:"Salvar" }}</button>
</div>
