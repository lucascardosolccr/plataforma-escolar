{% if f.non_field_errors %}
<div class="alert alert-danger" role="alert">
  <div>{% for error in f.non_field_errors %}<div>{{ error }}</div>{% endfor %}</div>
</div>
{% endif %}
{% if f.errors %}<p class="visually-hidden" role="alert">O formulário tem campos a corrigir.</p>{% endif %}
<div class="row g-3 mb-3 form-grid">
  {% for field in f %}{% include "partials/_field.html" with field=field %}{% endfor %}
</div>
