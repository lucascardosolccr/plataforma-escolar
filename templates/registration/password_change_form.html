{% extends "base.html" %}
{% block title %}Alterar senha — Plataforma Escolar{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h1 class="h4 mb-1">Alterar senha</h1>
      <p class="text-body-secondary small mb-4">Informe a senha atual e a nova senha desejada.</p>
      <form method="post">
        {% csrf_token %}
        {% include "partials/_form_fields.html" with f=form %}
        <button type="submit" class="btn btn-primary w-100">Salvar nova senha</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
