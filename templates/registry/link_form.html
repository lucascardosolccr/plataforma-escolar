{% extends "base.html" %}
{% block title %}Novo vínculo — Plataforma Escolar{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">
    <div class="card p-4">
      <h1 class="h4 mb-1">Criar vínculo validado</h1>
      <p class="text-body-secondary small mb-4">
        Vincula um responsável a um estudante com validação imediata da secretaria.
      </p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "partials/_form_fields.html" with f=form %}
        <button type="submit" class="btn btn-primary w-100 mt-2">Criar e validar vínculo</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
